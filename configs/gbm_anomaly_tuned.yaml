# Same model, but the learning rate and leaf count are chosen per fold on a purged
# inner split of the training block only - never on the fold's test year.
name: gbm_anomaly_tuned
seed: 7

data:
  symbols: ["@us_large_cap_plus_etfs"]
  start: "2005-01-01"
  end: "2024-12-31"
  cache_dir: data/cache

features:
  momentum_windows: [5, 21, 63, 126, 252]
  skip_momentum_windows: [126, 252]
  volatility_windows: [21, 63]
  ma_ratio_windows: [20, 50, 200]
  rsi_window: 14
  volume_window: 21
  cross_sectional_rank: true
  cross_sectional_zscore: true
  beta_window: 126
  anomaly_signals: true

splits:
  train_years: 6
  test_years: 1
  step_years: 1
  expanding: true

backtest:
  weighting: rank
  allow_short: true
  max_gross_exposure: 1.0
  cost_bps: 5.0
  execution_lag: 1
  volatility_target: 0.10

label:
  horizon: 21
  kind: binary
  excess_of_market: true

model:
  name: gbm
  params:
    n_estimators: 300
    min_child_samples: 400
    verbose: -1
  tune: [learning_rate, num_leaves]
  tune_grid:
    learning_rate: [0.01, 0.03]
    num_leaves: [7, 15]
